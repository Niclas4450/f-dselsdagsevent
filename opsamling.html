<!DOCTYPE html>
<html lang="da">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opsamling | Eventnavn</title>
  <link rel="stylesheet" href="./starter.css">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <header class="site-header pirat-trae">
    <div class="header-content">
      <a class="site-logo" href="./">
        <span class="gul-tekst">FØDSELSDAGS</span> EVENT
      </a>
      <nav class="site-nav">
        <button popovertarget="menu">Menu</button>
        <ul class="menu" id="menu" popover>
          <li><a href="./" aria-current="page">Forside</a></li>
          <li><a href="./svg.html">Interaktiv SVG</a></li>
          <li><a href="./form.html">Formular</a></li>
        </ul>
      </nav>
    </div>
  </header>


  <main>
    <section class="opsamling-page">
      <div class="opsamling-intro">
        <h1>Opsamling</h1>
        <div class="actions">
          <a class="button" href="./form.html">Tilbage til formular</a>
        </div>
      </div>
      <div class="invitation-kort">
        <h2>din invitation</h2>
        <div class="info-liste">
          <div class="navn">
            <p><strong>Navn:</strong><span class="nickname"></span></p>
          </div>
          <div class="tal">
            <p><strong>Alder:</strong><span class="alder"></span></p>
          </div>
          <div class="deltagelse">
            <p><strong>Deltager du:</strong> <span class="deltag"></span></p>
          </div>
          <div class="hype-boks">
            <p><strong>Hvor meget du glæder dig fra 1-100%</strong> <span class="hype"></span>%</p>
          </div>
        </div>

        <div class="grid_2">
          <div>
            <h2>Dine drikkevarer</h2>
            <p class="valgte-drikke-tekst"></p>
            <div class="grid_2_1">
              <img id="vand" src="vand.jpg" alt="Vand">
              <img id="juice" src="juice.jpg" alt="Juice">
              <img id="saftevand" src="saft.jpg" alt="Saftevand">
              <img id="sodavand" src="soda.jpg" alt="Sodavand">
            </div>
          </div>
          <div>
            <h2>Dit madvalg</h2>
            <p class="valgt-mad-tekst"></p>
            <img id="lasagne" src="Lasagne.webp">
            <img id="burger" src="burger.webp">
            <img id="pizza" src="pizza.webp">
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer pirat-trae">
    <div class="footer-content">
      <p><span class="gul-tekst">FØDSELSDAGS</span> EVENT</p>

    </div>
  </footer>
  <script src="./opsamling.js"></script>

</body>

</html>
